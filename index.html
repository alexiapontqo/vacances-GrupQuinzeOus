<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestio Vacances i Horaris - Grup Quinze Ous</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        @media print {
          body { background: white !important; color: black !important; }
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          .print-area { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: white;
            color: black;
            padding: 20px;
          }
          .print-area * { color: black !important; background: white !important; border-color: #ccc !important; }
          .print-area .bg-green-600\/30 { background: #d1fae5 !important; }
          .print-area .text-green-300 { color: #065f46 !important; }
        }
    </style>
</head>
<body class="bg-black text-white">
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
const { useState, useEffect } = React;

const MONTHS = ['Gener', 'Febrer', 'Marc', 'Abril', 'Maig', 'Juny', 'Juliol', 'Agost', 'Setembre', 'Octubre', 'Novembre', 'Desembre'];
const DAYS_SHORT = ['Dl', 'Dt', 'Dc', 'Dj', 'Dv', 'Ds', 'Dg'];
const DAYS_FULL = ['Dilluns', 'Dimarts', 'Dimecres', 'Dijous', 'Divendres', 'Dissabte', 'Diumenge'];

const RESTAURANTS = [
  { id: 'quinze-ous', nom: 'Quinze Ous', color: 'orange' },
  { id: 'quina-barra', nom: 'Quina Barra', color: 'blue' },
  { id: 'malespina', nom: 'Malespina', color: 'green' },
  { id: 'caterings', nom: 'Caterings', color: 'purple' }
];

const defaultFestius = [
  { nom: "Any Nou", data: "2026-01-01", actiu: false },
  { nom: "Reis", data: "2026-01-06", actiu: true },
  { nom: "Divendres Sant", data: "2026-04-03", actiu: true },
  { nom: "Dilluns Pasqua", data: "2026-04-06", actiu: false },
  { nom: "Festa Treball", data: "2026-05-01", actiu: true },
  { nom: "Sant Joan", data: "2026-06-24", actiu: true },
  { nom: "Assumpcio", data: "2026-08-15", actiu: true },
  { nom: "Diada", data: "2026-09-11", actiu: true },
  { nom: "Festa Local 1", data: "2026-09-07", actiu: false },
  { nom: "Festa Local 2", data: "2026-09-08", actiu: true },
  { nom: "Hispanitat", data: "2026-10-12", actiu: false },
  { nom: "Immaculada", data: "2026-12-08", actiu: true },
  { nom: "Nadal", data: "2026-12-25", actiu: true },
  { nom: "Sant Esteve", data: "2026-12-26", actiu: true }
];

const defaultHorariBase = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };

const defaultState = {
  year: 2026,
  selectedWorker: null,
  currentAction: 'vacances',
  currentRestaurant: 'quinze-ous',
  workers: [],
  workerEventsByYear: {},
  horarisSetmanals: {},
  config: {
    'quinze-ous': {
      diesConveni: 23,
      tancaments: [
        { nom: "Setmana Febrer", inici: "2026-02-09", fi: "2026-02-15" },
        { nom: "Setmana Octubre", inici: "2026-10-05", fi: "2026-10-11" }
      ],
      festius: JSON.parse(JSON.stringify(defaultFestius)),
      oberturesExcepcionals: []
    },
    'quina-barra': {
      diesConveni: 23,
      tancaments: [],
      festius: JSON.parse(JSON.stringify(defaultFestius)),
      oberturesExcepcionals: []
    },
    'malespina': {
      diesConveni: 23,
      tancaments: [],
      festius: JSON.parse(JSON.stringify(defaultFestius)),
      oberturesExcepcionals: []
    },
    'caterings': {
      diesConveni: 23,
      tancaments: [],
      festius: JSON.parse(JSON.stringify(defaultFestius)),
      oberturesExcepcionals: []
    }
  }
};

function App() {
  const [state, setState] = useState(() => {
    let saved = localStorage.getItem('vacancesGrupQuinzeOus_v5');
    if (!saved) saved = localStorage.getItem('vacancesGrupQuinzeOus_v4');
    if (!saved) saved = localStorage.getItem('vacancesGrupQuinzeOus_v3');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (!parsed.config) parsed.config = JSON.parse(JSON.stringify(defaultState.config));
        RESTAURANTS.forEach(r => {
          if (!parsed.config[r.id]) {
            parsed.config[r.id] = { diesConveni: 23, tancaments: [], festius: JSON.parse(JSON.stringify(defaultFestius)), oberturesExcepcionals: [] };
          }
          if (!parsed.config[r.id].oberturesExcepcionals) parsed.config[r.id].oberturesExcepcionals = [];
          if (!parsed.config[r.id].tancaments) parsed.config[r.id].tancaments = [];
          if (!parsed.config[r.id].festius) parsed.config[r.id].festius = JSON.parse(JSON.stringify(defaultFestius));
        });
        if (parsed.workerEvents && !parsed.workerEventsByYear) {
          parsed.workerEventsByYear = { "2026": parsed.workerEvents };
        }
        if (!parsed.workerEventsByYear) parsed.workerEventsByYear = {};
        delete parsed.workerEvents;
        if (!parsed.horarisSetmanals) parsed.horarisSetmanals = {};
        if (parsed.workers) {
          parsed.workers = parsed.workers.map(w => ({
            ...w,
            dataInici: w.dataInici || null,
            diesAnyAnterior: w.diesAnyAnterior || 0,
            horariBase: w.horariBase || JSON.parse(JSON.stringify(defaultHorariBase))
          }));
        } else {
          parsed.workers = [];
        }
        return { 
          year: parsed.year || 2026,
          selectedWorker: parsed.selectedWorker || null,
          currentAction: parsed.currentAction || 'vacances',
          currentRestaurant: parsed.currentRestaurant || 'quinze-ous',
          workers: parsed.workers,
          workerEventsByYear: parsed.workerEventsByYear,
          horarisSetmanals: parsed.horarisSetmanals,
          config: parsed.config
        };
      } catch (e) {
        console.error('Error carregant dades:', e);
        return defaultState;
      }
    }
    return defaultState;
  });
  
  const [view, setView] = useState('calendar');
  const [newWorkerName, setNewWorkerName] = useState('');
  const [toast, setToast] = useState('');
  const [calendarView, setCalendarView] = useState('individual');
  const [selectedRestaurants, setSelectedRestaurants] = useState(['quinze-ous', 'quina-barra', 'malespina', 'caterings']);
  const [editingWorker, setEditingWorker] = useState(null);
  const [editingHorari, setEditingHorari] = useState(false);
  const [currentWeekOffset, setCurrentWeekOffset] = useState(0);
  const [editingCell, setEditingCell] = useState(null); // { workerId, dateStr }
  const [showAddWorkerToWeek, setShowAddWorkerToWeek] = useState(false);
  const [weekWorkers, setWeekWorkers] = useState([]); // Treballadors afegits a la setmana
  
  const currentConfig = state.config[state.currentRestaurant] || defaultState.config['quinze-ous'];
  const currentYearEvents = state.workerEventsByYear[state.year] || {};
  
  useEffect(() => {
    localStorage.setItem('vacancesGrupQuinzeOus_v5', JSON.stringify(state));
  }, [state]);
  
  // Actualitzar weekWorkers quan canvia la setmana
  useEffect(() => {
    const weekDates = getWeekDates(currentWeekOffset);
    const weekKey = getWeekKey(weekDates[0]);
    const savedWeekWorkers = state.horarisSetmanals[weekKey]?.__weekWorkers || [];
    setWeekWorkers(savedWeekWorkers);
  }, [currentWeekOffset, state.currentRestaurant]);
  
  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2000);
  };

  const getWeekDates = (offset = 0) => {
    const today = new Date();
    const currentDay = today.getDay();
    const mondayOffset = currentDay === 0 ? -6 : 1 - currentDay;
    const monday = new Date(today);
    monday.setDate(today.getDate() + mondayOffset + (offset * 7));
    const dates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      dates.push(d);
    }
    return dates;
  };

  const formatDate = (date) => {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  };

  const getWeekKey = (date) => {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
    const week1 = new Date(d.getFullYear(), 0, 4);
    const weekNum = 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    return d.getFullYear() + '-W' + String(weekNum).padStart(2, '0');
  };

  const isDiaLaborable = (dateStr) => {
    const parts = dateStr.split('-');
    const date = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    const dayOfWeek = date.getDay();
    return dayOfWeek >= 2 && dayOfWeek <= 6;
  };

  const isOberturaExcepcional = (dateStr, restaurantId) => {
    const config = state.config[restaurantId] || currentConfig;
    return config.oberturesExcepcionals?.some(o => o.data === dateStr) || false;
  };

  const countOberturesExcepcionals = (restaurantId) => {
    const config = state.config[restaurantId] || currentConfig;
    const year = state.year.toString();
    return (config.oberturesExcepcionals || []).filter(o => o.data && o.data.startsWith(year)).length;
  };

  const countTancamentDays = (restaurantId) => {
    const config = state.config[restaurantId] || currentConfig;
    const year = state.year.toString();
    let total = 0;
    config.tancaments.forEach(t => {
      if (t.inici && t.fi && t.inici.startsWith(year)) {
        let current = new Date(parseInt(t.inici.split('-')[0]), parseInt(t.inici.split('-')[1]) - 1, parseInt(t.inici.split('-')[2]));
        const endParts = t.fi.split('-');
        const end = new Date(parseInt(endParts[0]), parseInt(endParts[1]) - 1, parseInt(endParts[2]));
        while (current <= end) {
          const dateStr = current.getFullYear() + '-' + String(current.getMonth() + 1).padStart(2, '0') + '-' + String(current.getDate()).padStart(2, '0');
          if (isDiaLaborable(dateStr)) total++;
          current.setDate(current.getDate() + 1);
        }
      }
    });
    return total;
  };

  const calcularDiesProporcionals = (worker, diesConveni) => {
    if (!worker.dataInici) return diesConveni;
    const anyActual = state.year;
    const dataIniciParts = worker.dataInici.split('-');
    const dataInici = new Date(parseInt(dataIniciParts[0]), parseInt(dataIniciParts[1]) - 1, parseInt(dataIniciParts[2]));
    const anyInici = dataInici.getFullYear();
    if (anyInici < anyActual) return diesConveni;
    if (anyInici === anyActual) {
      const inicAny = new Date(anyActual, 0, 1);
      const fiAny = new Date(anyActual, 11, 31);
      const diesTotalsAny = Math.ceil((fiAny - inicAny) / (1000 * 60 * 60 * 24)) + 1;
      const diesTreballats = Math.ceil((fiAny - dataInici) / (1000 * 60 * 60 * 24)) + 1;
      const proporcio = diesTreballats / diesTotalsAny;
      return Math.round(diesConveni * proporcio);
    }
    return 0;
  };

  const getFestiuByDate = (dateStr, festius) => {
    const mesDia = dateStr.substring(5);
    return festius.find(f => f.data.substring(5) === mesDia);
  };

  // Calcular hores d'un torn
  const calcularHoresTorn = (torn) => {
    if (!torn.inici || !torn.fi) return 0;
    const [h1, m1] = torn.inici.split(':').map(Number);
    const [h2, m2] = torn.fi.split(':').map(Number);
    let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (mins < 0) mins += 24 * 60; // Si passa mitjanit
    return mins / 60;
  };

  // Calcular hores setmanals base d'un treballador
  const calcularHoresSetmanalsBase = (worker) => {
    if (!worker.horariBase) return 0;
    let total = 0;
    for (let dia = 0; dia < 7; dia++) {
      const torns = worker.horariBase[dia] || [];
      torns.forEach(torn => {
        total += calcularHoresTorn(torn);
      });
    }
    return total;
  };

  const getWorkerStats = (workerId) => {
    const worker = state.workers.find(w => w.id === workerId);
    if (!worker) return { diesConveni: 0, diesProporcionals: 0, festiusTotals: 0, festiusTreballats: 0, oberturesExc: 0, totalDies: 0, tancamentDies: 0, vacances: 0, festiusRecuperats: 0, baixes: 0, pendents: 0, diesAnyAnterior: 0, recAnyAnterior: 0, pendentsAnyAnterior: 0 };
    
    const config = state.config[worker.restaurant] || currentConfig;
    const events = currentYearEvents[workerId] || {};
    let vacances = 0, baixes = 0, festiusRecuperats = 0, vacancesEnFestiu = 0, recAnyAnterior = 0;
    const festiuMesDia = config.festius.filter(f => f.actiu).map(f => f.data.substring(5));

    Object.entries(events).forEach(([date, type]) => {
      const esLaborable = isDiaLaborable(date) || isOberturaExcepcional(date, worker.restaurant);
      if (!esLaborable) return;
      const mesDia = date.substring(5);
      if (type === 'vacances') {
        vacances++;
        if (festiuMesDia.includes(mesDia)) vacancesEnFestiu++;
      } else if (type === 'baixa') {
        baixes++;
      } else if (type === 'festiu') {
        festiusRecuperats++;
      } else if (type === 'recAnterior') {
        recAnyAnterior++;
      }
    });

    const tancamentDies = countTancamentDays(worker.restaurant);
    const festiusTotals = config.festius.filter(f => f.actiu && isDiaLaborable(f.data)).length;
    const festiusTreballats = festiusTotals - vacancesEnFestiu;
    const oberturesExc = countOberturesExcepcionals(worker.restaurant);
    const diesProporcionals = calcularDiesProporcionals(worker, config.diesConveni);
    const totalDies = diesProporcionals + festiusTreballats + oberturesExc;
    const diesAgafats = vacances + tancamentDies;
    const pendents = totalDies - diesAgafats - festiusRecuperats;
    const diesAnyAnterior = worker.diesAnyAnterior || 0;
    const pendentsAnyAnterior = diesAnyAnterior - recAnyAnterior;

    return { diesConveni: config.diesConveni, diesProporcionals, festiusTotals, festiusTreballats, oberturesExc, totalDies, tancamentDies, vacances, festiusRecuperats, baixes, pendents, diesAnyAnterior, recAnyAnterior, pendentsAnyAnterior };
  };

  const getWorkerHorariForDate = (workerId, dateStr) => {
    const worker = state.workers.find(w => w.id === workerId);
    if (!worker) return [];
    const weekKey = getWeekKey(new Date(dateStr));
    if (state.horarisSetmanals[weekKey]?.[workerId]?.[dateStr]) {
      return state.horarisSetmanals[weekKey][workerId][dateStr];
    }
    const parts = dateStr.split('-');
    const date = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    const dayOfWeek = (date.getDay() + 6) % 7;
    return worker.horariBase?.[dayOfWeek] || [];
  };

  const updateHorariBase = (workerId, dayIndex, horaris) => {
    setState(s => ({
      ...s,
      workers: s.workers.map(w => {
        if (w.id === workerId) {
          const newHorariBase = { ...w.horariBase };
          newHorariBase[dayIndex] = horaris;
          return { ...w, horariBase: newHorariBase };
        }
        return w;
      })
    }));
  };

  const updateHorariSetmanal = (weekKey, workerId, dateStr, horaris) => {
    setState(s => {
      const newHorarisSetmanals = { ...s.horarisSetmanals };
      if (!newHorarisSetmanals[weekKey]) newHorarisSetmanals[weekKey] = {};
      if (!newHorarisSetmanals[weekKey][workerId]) newHorarisSetmanals[weekKey][workerId] = {};
      newHorarisSetmanals[weekKey][workerId][dateStr] = horaris;
      return { ...s, horarisSetmanals: newHorarisSetmanals };
    });
  };

  const addWorkerToWeek = (workerId) => {
    const weekDates = getWeekDates(currentWeekOffset);
    const weekKey = getWeekKey(weekDates[0]);
    const newWeekWorkers = [...weekWorkers, workerId];
    setWeekWorkers(newWeekWorkers);
    setState(s => {
      const newHorarisSetmanals = { ...s.horarisSetmanals };
      if (!newHorarisSetmanals[weekKey]) newHorarisSetmanals[weekKey] = {};
      newHorarisSetmanals[weekKey].__weekWorkers = newWeekWorkers;
      return { ...s, horarisSetmanals: newHorarisSetmanals };
    });
    setShowAddWorkerToWeek(false);
  };

  const removeWorkerFromWeek = (workerId) => {
    const weekDates = getWeekDates(currentWeekOffset);
    const weekKey = getWeekKey(weekDates[0]);
    const newWeekWorkers = weekWorkers.filter(id => id !== workerId);
    setWeekWorkers(newWeekWorkers);
    setState(s => {
      const newHorarisSetmanals = { ...s.horarisSetmanals };
      if (newHorarisSetmanals[weekKey]) {
        newHorarisSetmanals[weekKey].__weekWorkers = newWeekWorkers;
        delete newHorarisSetmanals[weekKey][workerId];
      }
      return { ...s, horarisSetmanals: newHorarisSetmanals };
    });
  };

  const exportToExcel = () => {
    let csv = 'RESUM VACANCES ' + state.year + '\n\n';
    csv += 'Restaurant,Treballador,Data Inici,Dies Conveni,Dies Proporcionals,Festius Treb.,Obert. Exc.,Total,Tancaments,Vacances,Pendents,Dies Any Ant.,Rec. Any Ant.,Pend. Any Ant.\n';
    if (state.workers.length === 0) {
      csv += 'No hi ha treballadors\n';
    } else {
      state.workers.forEach(w => {
        const stats = getWorkerStats(w.id);
        const rest = RESTAURANTS.find(r => r.id === w.restaurant);
        const restNom = rest ? rest.nom : 'Sense restaurant';
        const dataInici = w.dataInici || 'Abans 2026';
        csv += restNom + ',' + w.nom + ',' + dataInici + ',' + stats.diesConveni + ',' + stats.diesProporcionals + ',' + stats.festiusTreballats + ',' + stats.oberturesExc + ',' + stats.totalDies + ',' + stats.tancamentDies + ',' + stats.vacances + ',' + stats.pendents + ',' + stats.diesAnyAnterior + ',' + stats.recAnyAnterior + ',' + stats.pendentsAnyAnterior + '\n';
      });
    }
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vacances_' + state.year + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Excel descarregat!');
  };

  const handlePrint = () => {
    window.print();
  };

  const addWorker = () => {
    if (!newWorkerName.trim()) return;
    const id = 'w_' + Date.now();
    setState(s => ({
      ...s,
      workers: [...s.workers, { id, nom: newWorkerName.trim(), restaurant: s.currentRestaurant, dataInici: null, diesAnyAnterior: 0, horariBase: JSON.parse(JSON.stringify(defaultHorariBase)) }]
    }));
    setNewWorkerName('');
    showToast('Treballador afegit!');
  };

  const deleteWorker = (id) => {
    if (!confirm('Segur que vols eliminar aquest treballador?')) return;
    setState(s => {
      const newEventsByYear = { ...s.workerEventsByYear };
      Object.keys(newEventsByYear).forEach(year => {
        if (newEventsByYear[year][id]) delete newEventsByYear[year][id];
      });
      return {
        ...s,
        workers: s.workers.filter(w => w.id !== id),
        workerEventsByYear: newEventsByYear,
        selectedWorker: s.selectedWorker === id ? null : s.selectedWorker
      };
    });
    setEditingWorker(null);
    setEditingHorari(false);
  };

  const updateWorker = (id, field, value) => {
    setState(s => ({
      ...s,
      workers: s.workers.map(w => w.id === id ? { ...w, [field]: value } : w)
    }));
  };

  const getDayClass = (dateStr, dayOfWeek) => {
    const worker = state.workers.find(w => w.id === state.selectedWorker);
    const restaurantId = worker ? worker.restaurant : state.currentRestaurant;
    if (state.selectedWorker) {
      const events = currentYearEvents[state.selectedWorker] || {};
      if (events[dateStr]) return events[dateStr];
    }
    if (isOberturaExcepcional(dateStr, restaurantId)) return 'obertura';
    for (const t of currentConfig.tancaments) {
      if (t.inici && t.fi && dateStr >= t.inici && dateStr <= t.fi) return 'tancament';
    }
    const festiu = getFestiuByDate(dateStr, currentConfig.festius);
    if (festiu && festiu.actiu) return 'festiu';
    if (festiu && !festiu.actiu) return 'tancat';
    if (dayOfWeek === 6 || dayOfWeek === 0) return 'tancat';
    return 'normal';
  };

  const handleDayClick = (dateStr) => {
    if (!state.selectedWorker) {
      showToast('Selecciona un treballador primer!');
      return;
    }
    const worker = state.workers.find(w => w.id === state.selectedWorker);
    const restaurantId = worker ? worker.restaurant : state.currentRestaurant;
    for (const t of currentConfig.tancaments) {
      if (t.inici && t.fi && dateStr >= t.inici && dateStr <= t.fi) {
        showToast('Aquest dia es de tancament obligatori');
        return;
      }
    }
    const esLaborable = isDiaLaborable(dateStr) || isOberturaExcepcional(dateStr, restaurantId);
    if (!esLaborable && state.currentAction !== 'esborrar') {
      showToast('Aquest dia el restaurant esta tancat');
      return;
    }
    setState(s => {
      const yearEvents = s.workerEventsByYear[s.year] || {};
      const workerEvents = { ...yearEvents[s.selectedWorker] } || {};
      if (s.currentAction === 'esborrar') {
        delete workerEvents[dateStr];
      } else {
        workerEvents[dateStr] = s.currentAction;
      }
      return { ...s, workerEventsByYear: { ...s.workerEventsByYear, [s.year]: { ...yearEvents, [s.selectedWorker]: workerEvents } } };
    });
  };

  const getWorkersOnDate = (dateStr) => {
    const result = { vacances: [], baixa: [], festiu: [], recAnterior: [] };
    state.workers.filter(w => selectedRestaurants.includes(w.restaurant)).forEach(w => {
      const events = currentYearEvents[w.id] || {};
      if (events[dateStr]) result[events[dateStr]]?.push(w.nom);
    });
    return result;
  };
  
  const updateConfig = (field, value) => {
    setState(s => ({
      ...s,
      config: { ...s.config, [s.currentRestaurant]: { ...s.config[s.currentRestaurant], [field]: value } }
    }));
  };

  // Component editor de cel·la d'horari
  const CellEditor = ({ workerId, dateStr, onClose }) => {
    const weekKey = getWeekKey(new Date(dateStr));
    const currentHoraris = getWorkerHorariForDate(workerId, dateStr);
    const [horaris, setHoraris] = useState(currentHoraris);
    const [newInici, setNewInici] = useState('');
    const [newFi, setNewFi] = useState('');

    const addTorn = () => {
      if (newInici && newFi) {

  const renderMonth = (month) => {
    const year = state.year;
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startWeekday = (firstDay.getDay() + 6) % 7;
    const weeks = [];
    let currentWeek = [];
    for (let i = 0; i < startWeekday; i++) currentWeek.push(null);
    for (let day = 1; day <= lastDay.getDate(); day++) {
      currentWeek.push(day);
      if (currentWeek.length === 7) { weeks.push(currentWeek); currentWeek = []; }
    }
    if (currentWeek.length > 0) {
      while (currentWeek.length < 7) currentWeek.push(null);
      weeks.push(currentWeek);
    }
    const colors = {
      tancat: 'bg-zinc-700 text-zinc-400',
      festiu: 'bg-amber-500 text-black',
      obertura: 'bg-pink-500 text-white',
      tancament: 'bg-red-500 text-white',
      vacances: 'bg-emerald-500 text-white',
      baixa: 'bg-purple-500 text-white',
      recAnterior: 'bg-cyan-500 text-white',
      normal: 'text-zinc-200 hover:bg-zinc-600'
    };
    const dayLabels = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
    
    return (
      <div key={month} className="bg-zinc-800 rounded-lg overflow-hidden">
        <div className="bg-orange-500 text-white text-center py-2 font-bold text-sm">{MONTHS[month]}</div>
        <div className="p-3">

            <div key={wi} className="grid grid-cols-7 gap-1 mb-1">
              {week.map((day, di) => {
                if (day === null) return <div key={di} className="h-7" />;
                const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const type = getDayClass(dateStr, di);
                return (
                  <div key={di} onClick={() => handleDayClick(dateStr)} className={'h-7 flex items-center justify-center text-sm rounded cursor-pointer ' + colors[type]}>{day}</div>

              })}
            </div>
          ))}
        </div>
      </div>
    );
  };

                </div>
              ))}
              <button onClick={() => updateConfig('tancaments', [...currentConfig.tancaments, { nom: '', inici: '', fi: '' }])} className="mt-2 bg-zinc-800 border border-zinc-700 px-4 py-2 rounded text-sm">+ Afegir periode</button>
            </div>
            
            <div className="bg-pink-900/30 border border-pink-800 rounded-lg p-4 mb-4">
              <h3 className="font-semibold mb-1 text-pink-300">Obertures excepcionals</h3>
              <p className="text-sm text-pink-400/70 mb-3">Dies que obriu excepcionalment (dg, dl o festius tancats). Compten com a festiu a recuperar.</p>
              {(currentConfig.oberturesExcepcionals || []).map((o, i) => (
                <div key={i} className="flex gap-2 mb-2 items-center">
                  <input type="text" value={o.nom} onChange={e => { const newO = [...(currentConfig.oberturesExcepcionals || [])]; newO[i].nom = e.target.value; updateConfig('oberturesExcepcionals', newO); }} placeholder="Motiu" className="flex-1 bg-zinc-800 border border-pink-700 rounded px-3 py-2 text-sm" />
                  <input type="date" value={o.data} onChange={e => { const newO = [...(currentConfig.oberturesExcepcionals || [])]; newO[i].data = e.target.value; updateConfig('oberturesExcepcionals', newO); }} className="bg-zinc-800 border border-pink-700 rounded px-3 py-2 text-sm" />
                  <button onClick={() => updateConfig('oberturesExcepcionals', (currentConfig.oberturesExcepcionals || []).filter((_, idx) => idx !== i))} className="bg-red-500 px-3 py-2 rounded">X</button>
                </div>
              ))}
              <button onClick={() => updateConfig('oberturesExcepcionals', [...(currentConfig.oberturesExcepcionals || []), { nom: '', data: '' }])} className="mt-2 bg-pink-800 border border-pink-700 px-4 py-2 rounded text-sm">+ Afegir obertura</button>
            </div>
            
            <div className="bg-zinc-900 rounded-lg p-4 border border-zinc-800">
              <h3 className="font-semibold mb-1">Festius {state.year}</h3>
              <p className="text-sm text-zinc-500 mb-3">Activa els festius que treballeu</p>
              <div className="space-y-2">
                {currentConfig.festius.map((f, i) => (
                  <div key={i} className="flex justify-between items-center bg-zinc-800 rounded px-3 py-2">
                    <div>
                      <div className="text-sm">{f.nom}</div>
                      <div className="text-xs text-zinc-500 font-mono">{f.data}</div>
                    </div>
                    <label className="relative inline-flex cursor-pointer">
                      <input type="checkbox" checked={f.actiu} onChange={() => { const newF = [...currentConfig.festius]; newF[i].actiu = !newF[i].actiu; updateConfig('festius', newF); }} className="sr-only peer" />
                      <div className="w-11 h-6 bg-zinc-700 rounded-full peer peer-checked:bg-green-500 after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
                    </label>
                  </div>
                ))}
              </div>
            </div>
          </>
        )}
      </div>
      
      {/* Sidebar dreta */}
      <div className="w-80 bg-zinc-900 border-l border-zinc-800 p-4 overflow-y-auto flex-shrink-0 no-print">
        {!state.selectedWorker ? (
          <div className="flex flex-col gap-4">
            <div className="text-center text-zinc-500 py-4"><p className="text-sm">Selecciona un treballador</p></div>
            <div className="bg-zinc-800 rounded-lg p-3">
              <h3 className="text-xs uppercase text-zinc-500 tracking-wider mb-2">Resum general</h3>
              <div className="space-y-2 text-sm">
                <div className="flex justify-between"><span className="text-zinc-400">Treballadors:</span><span className="font-mono">{filteredWorkers.length}</span></div>
                <div className="flex justify-between"><span className="text-zinc-400">Dies conveni:</span><span className="font-mono">{currentConfig.diesConveni}</span></div>
                <div className="flex justify-between"><span className="text-zinc-400">Festius treballats:</span><span className="font-mono text-amber-400">{currentConfig.festius.filter(f => f.actiu && isDiaLaborable(f.data)).length}</span></div>
                <div className="flex justify-between"><span className="text-zinc-400">Obertures exc.:</span><span className="font-mono text-pink-400">{countOberturesExcepcionals(state.currentRestaurant)}</span></div>
                <div className="flex justify-between"><span className="text-zinc-400">Dies tancament:</span><span className="font-mono text-red-400">{countTancamentDays(state.currentRestaurant)}</span></div>
              </div>
            </div>
          </div>
        ) : (
          <>
            <div className="flex justify-between items-center border-b border-zinc-800 pb-3 mb-4">
              <span className="font-semibold text-lg">{selectedWorkerData?.nom}</span>
              <div className="flex gap-2">
                <button onClick={() => { setEditingWorker(editingWorker ? null : state.selectedWorker); setEditingHorari(false); }} className={'px-2 py-1 rounded text-xs ' + (editingWorker ? 'bg-orange-500' : 'bg-zinc-700')}>Dades</button>
                <button onClick={() => { setEditingHorari(!editingHorari); setEditingWorker(null); }} className={'px-2 py-1 rounded text-xs ' + (editingHorari ? 'bg-orange-500' : 'bg-zinc-700')}>Horari</button>
                <button onClick={() => deleteWorker(state.selectedWorker)} className="bg-red-500 px-2 py-1 rounded text-xs">X</button>
              </div>
            </div>
            
            {editingWorker === state.selectedWorker && (
              <div className="bg-zinc-800 rounded-lg p-3 mb-4 space-y-3">
                <div>
                  <label className="text-xs text-zinc-500">Data inici contracte</label>
                  <input type="date" value={selectedWorkerData?.dataInici || ''} onChange={e => updateWorker(state.selectedWorker, 'dataInici', e.target.value || null)} className="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm mt-1" />
                  <p className="text-xs text-zinc-600 mt-1">Deixa buit si va comenar abans del {state.year}</p>
                </div>
                <div>
                  <label className="text-xs text-zinc-500">Dies pendents any anterior</label>
                  <input type="number" value={selectedWorkerData?.diesAnyAnterior || 0} onChange={e => updateWorker(state.selectedWorker, 'diesAnyAnterior', parseInt(e.target.value) || 0)} className="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm mt-1" />
                </div>
              </div>
            )}
            
            {editingHorari && (
              <div className="bg-blue-900/30 border border-blue-800 rounded-lg p-3 mb-4">
                <h3 className="text-sm font-medium text-blue-300 mb-3">Horari Base Setmanal</h3>
                <div className="space-y-3">
                  {DAYS_FULL.map((day, i) => (
                    <HorariDiaEditor key={i} label={day} horaris={selectedWorkerData?.horariBase?.[i] || []} onChange={(h) => updateHorariBase(state.selectedWorker, i, h)} />
                  ))}
                </div>
                <div className="mt-4 pt-3 border-t border-blue-800">
                  <div className="flex justify-between items-center">
                    <span className="text-sm text-blue-300">Total hores setmanals:</span>
                    <span className="text-xl font-bold text-blue-400">{horesSetmanalsBase.toFixed(1)}h</span>
                  </div>
                </div>
              </div>
            )}
            
            {!editingWorker && !editingHorari && (
              <>
                <div className="bg-zinc-800 rounded-lg p-4 mb-4">
                  <h3 className="text-xs uppercase text-zinc-500 tracking-wider mb-3">Resum {state.year}</h3>
                  <div className="grid grid-cols-2 gap-2">
                    <div className="bg-zinc-900 rounded p-2 text-center">
                      <div className="font-mono text-xl font-bold">{stats.diesProporcionals}</div>
                      <div className="text-xs text-zinc-500">Dies any</div>
                    </div>
                    <div className="bg-zinc-900 rounded p-2 text-center">
                      <div className="font-mono text-xl font-bold text-amber-400">+{stats.festiusTreballats}</div>
                      <div className="text-xs text-zinc-500">Festius treb.</div>
                    </div>
                    {stats.oberturesExc > 0 && (
                      <div className="bg-zinc-900 rounded p-2 text-center">
                        <div className="font-mono text-xl font-bold text-pink-400">+{stats.oberturesExc}</div>
                        <div className="text-xs text-zinc-500">Obert. exc.</div>
                      </div>
                    )}
                    <div className="bg-zinc-900 rounded p-2 text-center">
                      <div className="font-mono text-xl font-bold text-blue-400">{stats.totalDies}</div>
                      <div className="text-xs text-zinc-500">Total a gaudir</div>
                    </div>
                    <div className="bg-zinc-900 rounded p-2 text-center">
                      <div className="font-mono text-xl font-bold text-red-400">{stats.tancamentDies}</div>
                      <div className="text-xs text-zinc-500">Tancaments</div>
                    </div>
                    <div className="bg-zinc-900 rounded p-2 text-center">
                      <div className="font-mono text-xl font-bold text-green-400">{stats.vacances}</div>
                      <div className="text-xs text-zinc-500">Vacances</div>
                    </div>
                    <div className="bg-zinc-900 rounded p-2 text-center">
                      <div className="font-mono text-xl font-bold text-purple-400">{stats.baixes}</div>
                      <div className="text-xs text-zinc-500">Baixes</div>
                    </div>
                  </div>
                  {stats.diesProporcionals < stats.diesConveni && (
                    <div className="mt-2 text-xs text-zinc-500 bg-zinc-900 rounded p-2">Proporcional: {stats.diesProporcionals} de {stats.diesConveni} dies</div>
                  )}
                  <div className="mt-4 pt-4 border-t border-zinc-700 text-center">
                    <div className={'font-mono text-3xl font-bold ' + (stats.pendents >= 0 ? 'text-green-400' : 'text-red-400')}>{stats.pendents}</div>
                    <div className="text-xs text-zinc-500">DIES PENDENTS {state.year}</div>
                  </div>
                </div>
                
                {(stats.diesAnyAnterior > 0 || stats.recAnyAnterior > 0) && (
                  <div className="bg-cyan-900/30 border border-cyan-800 rounded-lg p-3 mb-4">
                    <h3 className="text-xs uppercase text-cyan-400 tracking-wider mb-2">Any anterior</h3>
                    <div className="flex justify-between text-sm"><span className="text-zinc-400">Tenia:</span><span className="font-mono">{stats.diesAnyAnterior}</span></div>
                    <div className="flex justify-between text-sm"><span className="text-zinc-400">Recuperats:</span><span className="font-mono text-cyan-400">{stats.recAnyAnterior}</span></div>
                    <div className="flex justify-between text-sm font-medium mt-1 pt-1 border-t border-cyan-800"><span>Pendents:</span><span className={'font-mono ' + (stats.pendentsAnyAnterior > 0 ? 'text-cyan-400' : 'text-green-400')}>{stats.pendentsAnyAnterior}</span></div>
                  </div>
                )}
                
                <div className="bg-zinc-800 rounded-lg p-4">
                  <h3 className="text-xs uppercase text-zinc-500 tracking-wider mb-3">Accio al calendari</h3>
                  <div className="grid grid-cols-2 gap-2">
                    {[
                      { id: 'vacances', label: 'Vacances', color: 'border-green-400 bg-green-400/10 text-green-400' },
                      { id: 'baixa', label: 'Baixa', color: 'border-purple-400 bg-purple-400/10 text-purple-400' },
                      { id: 'festiu', label: 'Festiu rec.', color: 'border-amber-400 bg-amber-400/10 text-amber-400' },
                      { id: 'recAnterior', label: 'Rec. any ant.', color: 'border-cyan-400 bg-cyan-400/10 text-cyan-400' },
                      { id: 'esborrar', label: 'Esborrar', color: 'border-red-400 bg-red-400/10 text-red-400' }
                    ].map(action => (
                      <button key={action.id} onClick={() => setState(s => ({ ...s, currentAction: action.id }))} className={'p-2 rounded border-2 text-xs font-medium transition ' + (state.currentAction === action.id ? action.color : 'border-zinc-700 text-zinc-400')}>{action.label}</button>
                    ))}
                  </div>
                  <p className="text-xs text-zinc-500 mt-3">Clica els dies del calendari per marcar-los</p>
                </div>
              </>
            )}
          </>
        )}
      </div>
      
      {/* Modal editor de cel·la */}
      {editingCell && (
        <CellEditor workerId={editingCell.workerId} dateStr={editingCell.dateStr} onClose={() => setEditingCell(null)} />
      )}
      
      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-500 text-black px-6 py-3 rounded-lg font-semibold no-print">{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
