<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestio Vacances - Grup Quinze Ous</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        @media print {
          body { background: white !important; color: black !important; }
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          .print-area { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: white;
            color: black;
            padding: 20px;
          }
          .print-area * { color: black !important; background: white !important; border-color: #ccc !important; }
          .print-area .bg-green-600\/30 { background: #d1fae5 !important; }
          .print-area .text-green-300 { color: #065f46 !important; }
        }
    </style>
</head>
<body class="bg-black text-white">
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
const { useState, useEffect } = React;

const MONTHS = ['Gener', 'Febrer', 'Marc', 'Abril', 'Maig', 'Juny', 'Juliol', 'Agost', 'Setembre', 'Octubre', 'Novembre', 'Desembre'];
const DAYS_SHORT = ['Dl', 'Dt', 'Dc', 'Dj', 'Dv', 'Ds', 'Dg'];

const RESTAURANTS = [
  { id: 'quinze-ous', nom: 'Quinze Ous', color: 'orange' },
  { id: 'quina-barra', nom: 'Quina Barra', color: 'blue' },
  { id: 'malespina', nom: 'Malespina', color: 'green' },
  { id: 'caterings', nom: 'Caterings', color: 'purple' }
];

const ROLS = [
  { id: 'cuina', nom: 'Cuina', color: 'text-orange-400', bg: 'bg-orange-500/20' },
  { id: 'sala', nom: 'Sala', color: 'text-blue-400', bg: 'bg-blue-500/20' },
  { id: 'rentaplats', nom: 'Rentaplats', color: 'text-green-400', bg: 'bg-green-500/20' }
];

const ordenarPerRol = (workers) => {
  const ordre = { 'cuina': 0, 'sala': 1, 'rentaplats': 2 };
  return [...workers].sort((a, b) => (ordre[a.rol] || 1) - (ordre[b.rol] || 1));
};

const defaultFestius = [
  { nom: "Any Nou", data: "2026-01-01", actiu: false },
  { nom: "Reis", data: "2026-01-06", actiu: true },
  { nom: "Divendres Sant", data: "2026-04-03", actiu: true },
  { nom: "Dilluns Pasqua", data: "2026-04-06", actiu: false },
  { nom: "Festa Treball", data: "2026-05-01", actiu: true },
  { nom: "Sant Joan", data: "2026-06-24", actiu: true },
  { nom: "Assumpcio", data: "2026-08-15", actiu: true },
  { nom: "Diada", data: "2026-09-11", actiu: true },
  { nom: "Festa Local 1", data: "2026-09-07", actiu: false },
  { nom: "Festa Local 2", data: "2026-09-08", actiu: true },
  { nom: "Hispanitat", data: "2026-10-12", actiu: false },
  { nom: "Immaculada", data: "2026-12-08", actiu: true },
  { nom: "Nadal", data: "2026-12-25", actiu: true },
  { nom: "Sant Esteve", data: "2026-12-26", actiu: true }
];

const defaultState = {
  year: 2026,
  selectedWorker: null,
  currentAction: 'vacances',
  currentRestaurant: 'quinze-ous',
  workers: [],
  workerEventsByYear: {},
  config: {
    'quinze-ous': {
      diesConveni: 22,
      tancaments: [
        { nom: "Setmana Febrer", inici: "2026-02-09", fi: "2026-02-15" },
        { nom: "Setmana Octubre", inici: "2026-10-05", fi: "2026-10-11" }
      ],
      festius: JSON.parse(JSON.stringify(defaultFestius)),
      oberturesExcepcionals: []
    },
    'quina-barra': {
      diesConveni: 22,
      tancaments: [],
      festius: JSON.parse(JSON.stringify(defaultFestius)),
      oberturesExcepcionals: []
    },
    'malespina': {
      diesConveni: 22,
      tancaments: [],
      festius: JSON.parse(JSON.stringify(defaultFestius)),
      oberturesExcepcionals: []
    },
    'caterings': {
      diesConveni: 22,
      tancaments: [],
      festius: JSON.parse(JSON.stringify(defaultFestius)),
      oberturesExcepcionals: []
    }
  }
};

function App() {
  const [state, setState] = useState(() => {
    // Buscar dades a totes les versions possibles
    const versions = ['vacancesGrupQuinzeOus_v5', 'vacancesGrupQuinzeOus_v4', 'vacancesGrupQuinzeOus_v3', 'vacancesGrupQuinzeOus_v2', 'vacancesGrupQuinzeOus'];
    let saved = null;
    let usedVersion = null;
    
    for (const version of versions) {
      const data = localStorage.getItem(version);
      if (data) {
        try {
          const parsed = JSON.parse(data);
          // Verificar que té dades reals (treballadors o config)
          if (parsed && (parsed.workers?.length > 0 || parsed.config)) {
            saved = data;
            usedVersion = version;
            console.log('Dades carregades de:', version);
            break;
          }
        } catch (e) {
          console.log('Error parsing', version, e);
        }
      }
    }
    
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (!parsed.config) parsed.config = JSON.parse(JSON.stringify(defaultState.config));
        RESTAURANTS.forEach(r => {
          if (!parsed.config[r.id]) {
            parsed.config[r.id] = { diesConveni: 22, tancaments: [], festius: JSON.parse(JSON.stringify(defaultFestius)), oberturesExcepcionals: [] };
          }
          if (!parsed.config[r.id].oberturesExcepcionals) parsed.config[r.id].oberturesExcepcionals = [];
          if (!parsed.config[r.id].tancaments) parsed.config[r.id].tancaments = [];
          if (!parsed.config[r.id].festius) parsed.config[r.id].festius = JSON.parse(JSON.stringify(defaultFestius));
        });
        if (parsed.workerEvents && !parsed.workerEventsByYear) {
          parsed.workerEventsByYear = { "2026": parsed.workerEvents };
        }
        if (!parsed.workerEventsByYear) parsed.workerEventsByYear = {};
        delete parsed.workerEvents;
        if (parsed.workers) {
          parsed.workers = parsed.workers.map(w => ({
            ...w,
            dataInici: w.dataInici || null,
            diesAnyAnterior: w.diesAnyAnterior || 0,
            souBrut: w.souBrut || 0,
            souNet: w.souNet || 0,
            extraB: w.extraB || 0,
            anotacionsSou: w.anotacionsSou || '',
            rol: w.rol || 'sala'
          }));
        } else {
          parsed.workers = [];
        }
        return { 
          year: parsed.year || 2026,
          selectedWorker: parsed.selectedWorker || null,
          currentAction: parsed.currentAction || 'vacances',
          currentRestaurant: parsed.currentRestaurant || 'quinze-ous',
          workers: parsed.workers,
          workerEventsByYear: parsed.workerEventsByYear,
          config: parsed.config
        };
      } catch (e) {
        console.error('Error carregant dades:', e);
        return defaultState;
      }
    }
    return defaultState;
  });
  
  const [view, setView] = useState('calendar');
  const [newWorkerName, setNewWorkerName] = useState('');
  const [toast, setToast] = useState('');
  const [calendarView, setCalendarView] = useState('individual');
  const [selectedRestaurants, setSelectedRestaurants] = useState(['quinze-ous', 'quina-barra', 'malespina', 'caterings']);
  const [editingWorker, setEditingWorker] = useState(null);
  
  const currentConfig = state.config[state.currentRestaurant] || defaultState.config['quinze-ous'];
  const currentYearEvents = state.workerEventsByYear[state.year] || {};
  
  useEffect(() => {
    localStorage.setItem('vacancesGrupQuinzeOus_v5', JSON.stringify(state));
  }, [state]);
  
  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2000);
  };

  const formatDate = (date) => {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  };

  const isDiaLaborable = (dateStr) => {
    const parts = dateStr.split('-');
    const date = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    const dayOfWeek = date.getDay();
    return dayOfWeek >= 2 && dayOfWeek <= 6;
  };

  const isOberturaExcepcional = (dateStr, restaurantId) => {
    const config = state.config[restaurantId] || currentConfig;
    return config.oberturesExcepcionals?.some(o => o.data === dateStr) || false;
  };

  const countOberturesExcepcionals = (restaurantId) => {
    const config = state.config[restaurantId] || currentConfig;
    const year = state.year.toString();
    return (config.oberturesExcepcionals || []).filter(o => o.data && o.data.startsWith(year)).length;
  };

  const countTancamentDays = (restaurantId) => {
    const config = state.config[restaurantId] || currentConfig;
    const year = state.year.toString();
    let total = 0;
    config.tancaments.forEach(t => {
      if (t.inici && t.fi && t.inici.startsWith(year)) {
        let current = new Date(parseInt(t.inici.split('-')[0]), parseInt(t.inici.split('-')[1]) - 1, parseInt(t.inici.split('-')[2]));
        const endParts = t.fi.split('-');
        const end = new Date(parseInt(endParts[0]), parseInt(endParts[1]) - 1, parseInt(endParts[2]));
        while (current <= end) {
          const dateStr = current.getFullYear() + '-' + String(current.getMonth() + 1).padStart(2, '0') + '-' + String(current.getDate()).padStart(2, '0');
          if (isDiaLaborable(dateStr)) total++;
          current.setDate(current.getDate() + 1);
        }
      }
    });
    return total;
  };

  const calcularDiesProporcionals = (worker, diesConveni) => {
    if (!worker.dataInici) return diesConveni;
    const anyActual = state.year;
    const dataIniciParts = worker.dataInici.split('-');
    const dataInici = new Date(parseInt(dataIniciParts[0]), parseInt(dataIniciParts[1]) - 1, parseInt(dataIniciParts[2]));
    const anyInici = dataInici.getFullYear();
    if (anyInici < anyActual) return diesConveni;
    if (anyInici === anyActual) {
      const inicAny = new Date(anyActual, 0, 1);
      const fiAny = new Date(anyActual, 11, 31);
      const diesTotalsAny = Math.ceil((fiAny - inicAny) / (1000 * 60 * 60 * 24)) + 1;
      const diesTreballats = Math.ceil((fiAny - dataInici) / (1000 * 60 * 60 * 24)) + 1;
      const proporcio = diesTreballats / diesTotalsAny;
      return Math.round(diesConveni * proporcio);
    }
    return 0;
  };

  const getFestiuByDate = (dateStr, festius) => {
    const mesDia = dateStr.substring(5);
    return festius.find(f => f.data.substring(5) === mesDia);
  };

  const getWorkerStats = (workerId) => {
    const worker = state.workers.find(w => w.id === workerId);
    if (!worker) return { diesConveni: 0, diesProporcionals: 0, festiusTotals: 0, festiusTreballats: 0, oberturesExc: 0, totalDies: 0, tancamentDies: 0, vacances: 0, festiusRecuperats: 0, baixes: 0, pendents: 0, diesAnyAnterior: 0, recAnyAnterior: 0, pendentsAnyAnterior: 0 };
    
    const config = state.config[worker.restaurant] || currentConfig;
    const events = currentYearEvents[workerId] || {};
    let vacances = 0, baixes = 0, festiusRecuperats = 0, vacancesEnFestiu = 0, recAnyAnterior = 0;
    const festiuMesDia = config.festius.filter(f => f.actiu).map(f => f.data.substring(5));

    Object.entries(events).forEach(([date, type]) => {
      const esLaborable = isDiaLaborable(date) || isOberturaExcepcional(date, worker.restaurant);
      if (!esLaborable) return;
      const mesDia = date.substring(5);
      if (type === 'vacances') {
        vacances++;
        if (festiuMesDia.includes(mesDia)) vacancesEnFestiu++;
      } else if (type === 'baixa') {
        baixes++;
      } else if (type === 'festiu') {
        festiusRecuperats++;
      } else if (type === 'recAnterior') {
        recAnyAnterior++;
      }
    });

    const tancamentDies = countTancamentDays(worker.restaurant);
    const festiusTotals = config.festius.filter(f => f.actiu && isDiaLaborable(f.data)).length;
    const festiusTreballats = festiusTotals - vacancesEnFestiu;
    const oberturesExc = countOberturesExcepcionals(worker.restaurant);
    const diesProporcionals = calcularDiesProporcionals(worker, config.diesConveni);
    const totalDies = diesProporcionals + festiusTreballats + oberturesExc;
    const diesAgafats = vacances + tancamentDies;
    const pendents = totalDies - diesAgafats - festiusRecuperats;
    const diesAnyAnterior = worker.diesAnyAnterior || 0;
    const pendentsAnyAnterior = diesAnyAnterior - recAnyAnterior;

    return { diesConveni: config.diesConveni, diesProporcionals, festiusTotals, festiusTreballats, oberturesExc, totalDies, tancamentDies, vacances, festiusRecuperats, baixes, pendents, diesAnyAnterior, recAnyAnterior, pendentsAnyAnterior };
  };

  const exportToExcel = () => {
    let csv = 'RESUM VACANCES ' + state.year + '\n\n';
    csv += 'Restaurant,Treballador,Data Inici,Dies Conveni,Dies Proporcionals,Festius Treb.,Obert. Exc.,Total,Tancaments,Vacances,Pendents,Dies Any Ant.,Rec. Any Ant.,Pend. Any Ant.\n';
    if (state.workers.length === 0) {
      csv += 'No hi ha treballadors\n';
    } else {
      state.workers.forEach(w => {
        const stats = getWorkerStats(w.id);
        const rest = RESTAURANTS.find(r => r.id === w.restaurant);
        const restNom = rest ? rest.nom : 'Sense restaurant';
        const dataInici = w.dataInici || 'Abans 2026';
        csv += restNom + ',' + w.nom + ',' + dataInici + ',' + stats.diesConveni + ',' + stats.diesProporcionals + ',' + stats.festiusTreballats + ',' + stats.oberturesExc + ',' + stats.totalDies + ',' + stats.tancamentDies + ',' + stats.vacances + ',' + stats.pendents + ',' + stats.diesAnyAnterior + ',' + stats.recAnyAnterior + ',' + stats.pendentsAnyAnterior + '\n';
      });
    }
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vacances_' + state.year + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Excel descarregat!');
  };

  const handlePrint = () => {
    window.print();
  };

  const addWorker = () => {
    if (!newWorkerName.trim()) return;
    const id = 'w_' + Date.now();
    setState(s => ({
      ...s,
      workers: [...s.workers, { id, nom: newWorkerName.trim(), restaurant: s.currentRestaurant, dataInici: null, diesAnyAnterior: 0, souBrut: 0, souNet: 0, extraB: 0, anotacionsSou: '', rol: 'sala' }]
    }));
    setNewWorkerName('');
    showToast('Treballador afegit!');
  };

  const deleteWorker = (id) => {
    if (!confirm('Segur que vols eliminar aquest treballador?')) return;
    setState(s => {
      const newEventsByYear = { ...s.workerEventsByYear };
      Object.keys(newEventsByYear).forEach(year => {
        if (newEventsByYear[year][id]) delete newEventsByYear[year][id];
      });
      return {
        ...s,
        workers: s.workers.filter(w => w.id !== id),
        workerEventsByYear: newEventsByYear,
        selectedWorker: s.selectedWorker === id ? null : s.selectedWorker
      };
    });
    setEditingWorker(null);
  };

  const updateWorker = (id, field, value) => {
    setState(s => ({
      ...s,
      workers: s.workers.map(w => w.id === id ? { ...w, [field]: value } : w)
    }));
  };

  const getDayClass = (dateStr, dayOfWeek) => {
    const worker = state.workers.find(w => w.id === state.selectedWorker);
    const restaurantId = worker ? worker.restaurant : state.currentRestaurant;
    if (state.selectedWorker) {
      const events = currentYearEvents[state.selectedWorker] || {};
      if (events[dateStr]) return events[dateStr];
    }
    if (isOberturaExcepcional(dateStr, restaurantId)) return 'obertura';
    for (const t of currentConfig.tancaments) {
      if (t.inici && t.fi && dateStr >= t.inici && dateStr <= t.fi) return 'tancament';
    }
    const festiu = getFestiuByDate(dateStr, currentConfig.festius);
    if (festiu && festiu.actiu) return 'festiu';
    if (festiu && !festiu.actiu) return 'tancat';
    if (dayOfWeek === 6 || dayOfWeek === 0) return 'tancat';
    return 'normal';
  };

  const handleDayClick = (dateStr) => {
    if (!state.selectedWorker) {
      showToast('Selecciona un treballador primer!');
      return;
    }
    const worker = state.workers.find(w => w.id === state.selectedWorker);
    const restaurantId = worker ? worker.restaurant : state.currentRestaurant;
    for (const t of currentConfig.tancaments) {
      if (t.inici && t.fi && dateStr >= t.inici && dateStr <= t.fi) {
        showToast('Aquest dia es de tancament obligatori');
        return;
      }
    }
    const esLaborable = isDiaLaborable(dateStr) || isOberturaExcepcional(dateStr, restaurantId);
    if (!esLaborable && state.currentAction !== 'esborrar') {
      showToast('Aquest dia el restaurant esta tancat');
      return;
    }
    setState(s => {
      const yearEvents = s.workerEventsByYear[s.year] || {};
      const workerEvents = { ...yearEvents[s.selectedWorker] } || {};
      if (s.currentAction === 'esborrar') {
        delete workerEvents[dateStr];
      } else {
        workerEvents[dateStr] = s.currentAction;
      }
      return { ...s, workerEventsByYear: { ...s.workerEventsByYear, [s.year]: { ...yearEvents, [s.selectedWorker]: workerEvents } } };
    });
  };

  const getWorkersOnDate = (dateStr) => {
    const result = { vacances: [], baixa: [], festiu: [], recAnterior: [] };
    state.workers.filter(w => selectedRestaurants.includes(w.restaurant)).forEach(w => {
      const events = currentYearEvents[w.id] || {};
      if (events[dateStr]) result[events[dateStr]]?.push(w.nom);
    });
    return result;
  };
  
  const updateConfig = (field, value) => {
    setState(s => ({
      ...s,
      config: { ...s.config, [s.currentRestaurant]: { ...s.config[s.currentRestaurant], [field]: value } }
    }));
  };

  const selectedWorkerData = state.workers.find(w => w.id === state.selectedWorker);
  const stats = state.selectedWorker ? getWorkerStats(state.selectedWorker) : null;
  const filteredWorkers = state.workers.filter(w => w.restaurant === state.currentRestaurant);
  const currentRestaurantName = RESTAURANTS.find(r => r.id === state.currentRestaurant)?.nom || '';

  const renderMonth = (month) => {
    const year = state.year;
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startWeekday = (firstDay.getDay() + 6) % 7;
    const weeks = [];
    let currentWeek = [];
    for (let i = 0; i < startWeekday; i++) currentWeek.push(null);
    for (let day = 1; day <= lastDay.getDate(); day++) {
      currentWeek.push(day);
      if (currentWeek.length === 7) { weeks.push(currentWeek); currentWeek = []; }
    }
    if (currentWeek.length > 0) {
      while (currentWeek.length < 7) currentWeek.push(null);
      weeks.push(currentWeek);
    }
    const colors = {
      tancat: 'bg-zinc-700 text-zinc-400',
      festiu: 'bg-amber-500 text-black',
      obertura: 'bg-pink-500 text-white',
      tancament: 'bg-red-500 text-white',
      vacances: 'bg-emerald-500 text-white',
      baixa: 'bg-purple-500 text-white',
      recAnterior: 'bg-cyan-500 text-white',
      normal: 'text-zinc-200 hover:bg-zinc-600'
    };
    const dayLabels = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
    
    return (
      <div key={month} className="bg-zinc-800 rounded-lg overflow-hidden">
        <div className="bg-orange-500 text-white text-center py-2 font-bold text-sm">{MONTHS[month]}</div>
        <div className="p-3">
          <div className="grid grid-cols-7 gap-1 mb-2">
            {dayLabels.map((d, i) => (<div key={i} className="text-center text-zinc-400 text-xs font-medium">{d}</div>))}
          </div>
          {weeks.map((week, wi) => (
            <div key={wi} className="grid grid-cols-7 gap-1 mb-1">
              {week.map((day, di) => {
                if (day === null) return <div key={di} className="h-7" />;
                const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const type = getDayClass(dateStr, di);
                return (
                  <div key={di} onClick={() => handleDayClick(dateStr)} className={'h-7 flex items-center justify-center text-sm rounded cursor-pointer ' + colors[type]}>{day}</div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    );
  };

  const renderMonthGeneral = (month) => {
    const year = state.year;
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startWeekday = (firstDay.getDay() + 6) % 7;
    const weeks = [];
    let currentWeek = [];
    for (let i = 0; i < startWeekday; i++) currentWeek.push(null);
    for (let day = 1; day <= lastDay.getDate(); day++) {
      currentWeek.push(day);
      if (currentWeek.length === 7) { weeks.push(currentWeek); currentWeek = []; }
    }
    if (currentWeek.length > 0) {
      while (currentWeek.length < 7) currentWeek.push(null);
      weeks.push(currentWeek);
    }
    const dayLabels = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
    
    return (
      <div key={month} className="bg-zinc-800 rounded-lg overflow-hidden">
        <div className="bg-orange-500 text-white text-center py-2 font-bold text-sm">{MONTHS[month]}</div>
        <div className="p-2">
          <div className="grid grid-cols-7 gap-1 mb-2">
            {dayLabels.map((d, i) => (<div key={i} className="text-center text-zinc-400 text-xs font-medium">{d}</div>))}
          </div>
          {weeks.map((week, wi) => (
            <div key={wi} className="grid grid-cols-7 gap-1 mb-1">
              {week.map((day, di) => {
                if (day === null) return <div key={di} className="h-12" />;
                const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const dayType = getDayClass(dateStr, di);
                const workers = getWorkersOnDate(dateStr);
                let bgColor = '';
                if (dayType === 'tancat') bgColor = 'bg-zinc-700';
                else if (dayType === 'tancament') bgColor = 'bg-red-500/30';
                else if (dayType === 'festiu') bgColor = 'bg-amber-500/30';
                else if (dayType === 'obertura') bgColor = 'bg-pink-500/30';
                return (
                  <div key={di} className={'h-12 rounded text-xs p-0.5 ' + bgColor + (dayType === 'tancat' ? ' text-zinc-500' : '')}>

                </div>
              </div>
            </div>
            
            {/* ACCIONS CALENDARI - sempre visible */}
            <div className="bg-zinc-800 rounded-lg p-4">
              <h3 className="text-xs uppercase text-zinc-500 tracking-wider mb-3">Accio al calendari</h3>
              <div className="grid grid-cols-2 gap-2">
                {[
                  { id: 'vacances', label: 'Vacances', color: 'border-green-400 bg-green-400/10 text-green-400' },
                  { id: 'baixa', label: 'Baixa', color: 'border-purple-400 bg-purple-400/10 text-purple-400' },
                  { id: 'festiu', label: 'Festiu rec.', color: 'border-amber-400 bg-amber-400/10 text-amber-400' },
                  { id: 'recAnterior', label: 'Rec. any ant.', color: 'border-cyan-400 bg-cyan-400/10 text-cyan-400' },
                  { id: 'esborrar', label: 'Esborrar', color: 'border-red-400 bg-red-400/10 text-red-400' }
                ].map(action => (
                  <button key={action.id} onClick={() => setState(s => ({ ...s, currentAction: action.id }))} className={'p-2 rounded border-2 text-xs font-medium transition ' + (state.currentAction === action.id ? action.color : 'border-zinc-700 text-zinc-400')}>{action.label}</button>
                ))}
              </div>
              <p className="text-xs text-zinc-500 mt-3">Clica els dies del calendari per marcar-los</p>
            </div>
          </>
        )}
      </div>
      
      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-500 text-black px-6 py-3 rounded-lg font-semibold no-print">{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
