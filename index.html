<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestio Vacances - Grup Quinze Ous</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body class="bg-black text-white">
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
const { useState, useEffect } = React;

const MONTHS = ['Gener', 'Febrer', 'Marc', 'Abril', 'Maig', 'Juny', 'Juliol', 'Agost', 'Setembre', 'Octubre', 'Novembre', 'Desembre'];

const RESTAURANTS = [
  { id: 'quinze-ous', nom: 'Quinze Ous', color: 'orange' },
  { id: 'quina-barra', nom: 'Quina Barra', color: 'blue' },
  { id: 'malespina', nom: 'Malespina', color: 'green' },
  { id: 'caterings', nom: 'Caterings', color: 'purple' }
];

const defaultState = {
  year: 2026,
  diesConveni: 22,
  selectedWorker: null,
  currentAction: 'vacances',
  currentRestaurant: 'quinze-ous',
  workers: [],
  tancaments: [
    { nom: "Setmana Febrer", inici: "2026-02-09", fi: "2026-02-15" },
    { nom: "Setmana Octubre", inici: "2026-10-05", fi: "2026-10-11" }
  ],
  festius: [
    { nom: "Any Nou", data: "2026-01-01", actiu: false },
    { nom: "Reis", data: "2026-01-06", actiu: true },
    { nom: "Divendres Sant", data: "2026-04-03", actiu: true },
    { nom: "Dilluns Pasqua", data: "2026-04-06", actiu: false },
    { nom: "Festa Treball", data: "2026-05-01", actiu: true },
    { nom: "Sant Joan", data: "2026-06-24", actiu: true },
    { nom: "Assumpcio", data: "2026-08-15", actiu: true },
    { nom: "Diada", data: "2026-09-11", actiu: true },
    { nom: "Festa Local 1", data: "2026-09-07", actiu: false },
    { nom: "Festa Local 2", data: "2026-09-08", actiu: true },
    { nom: "Hispanitat", data: "2026-10-12", actiu: false },
    { nom: "Immaculada", data: "2026-12-08", actiu: true },
    { nom: "Nadal", data: "2026-12-25", actiu: true },
    { nom: "Sant Esteve", data: "2026-12-26", actiu: true }
  ],
  workerEvents: {}
};

function App() {
  const [state, setState] = useState(() => {
    const saved = localStorage.getItem('vacancesGrupQuinzeOus');
    if (saved) {
      try {
        return { ...defaultState, ...JSON.parse(saved) };
      } catch (e) {
        return defaultState;
      }
    }
    return defaultState;
  });
  const [view, setView] = useState('calendar');
  const [newWorkerName, setNewWorkerName] = useState('');
  const [toast, setToast] = useState('');
  const [calendarView, setCalendarView] = useState('individual');
  const [selectedRestaurants, setSelectedRestaurants] = useState(['quinze-ous', 'quina-barra', 'malespina', 'caterings']);
  
  useEffect(() => {
    localStorage.setItem('vacancesGrupQuinzeOus', JSON.stringify(state));
  }, [state]);
  
  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2000);
  };

  const isDiaLaborable = (dateStr) => {
    const date = new Date(dateStr);
    const dayOfWeek = date.getDay();
    return dayOfWeek >= 2 && dayOfWeek <= 6;
  };

  const countTancamentDays = () => {
    let total = 0;
    state.tancaments.forEach(t => {
      if (t.inici && t.fi) {
        let current = new Date(t.inici);
        const end = new Date(t.fi);
        while (current <= end) {
          const dateStr = current.toISOString().split('T')[0];
          if (isDiaLaborable(dateStr)) total++;
          current.setDate(current.getDate() + 1);
        }
      }
    });
    return total;
  };

  const getWorkerStats = (workerId) => {
    const events = state.workerEvents[workerId] || {};
    let vacances = 0, baixes = 0, festiusRecuperats = 0, vacancesEnFestiu = 0;
    const festiuDates = state.festius.filter(f => f.actiu).map(f => f.data);

    Object.entries(events).forEach(([date, type]) => {
      if (!isDiaLaborable(date)) return;
      if (type === 'vacances') {
        vacances++;
        if (festiuDates.includes(date)) vacancesEnFestiu++;
      } else if (type === 'baixa') {
        baixes++;
        if (festiuDates.includes(date)) vacancesEnFestiu++;
      } else if (type === 'festiu') {
        festiusRecuperats++;
      }
    });

    const tancamentDies = countTancamentDays();
    const festiusTotals = state.festius.filter(f => f.actiu && isDiaLaborable(f.data)).length;
    const festiusTreballats = festiusTotals - vacancesEnFestiu;
    const totalDies = state.diesConveni + festiusTreballats;
    const diesAgafats = vacances + tancamentDies;
    const pendents = totalDies - diesAgafats - festiusRecuperats;

    return { diesConveni: state.diesConveni, festiusTotals, festiusTreballats, vacancesEnFestiu, totalDies, tancamentDies, vacances, festiusRecuperats, baixes, pendents };
  };

  const exportToExcel = () => {
    let csv = 'RESUM VACANCES ' + state.year + '\n\n';
    csv += 'Restaurant,Treballador,Dies Conveni,Festius Treballats,Total a Gaudir,Tancaments,Vacances,Baixes,Pendents\n';
    
    if (state.workers.length === 0) {
      csv += 'No hi ha treballadors\n';
    } else {
      state.workers.forEach(w => {
        const stats = getWorkerStats(w.id);
        const rest = RESTAURANTS.find(r => r.id === w.restaurant);
        const restNom = rest ? rest.nom : 'Sense restaurant';
        csv += restNom + ',' + w.nom + ',' + stats.diesConveni + ',' + stats.festiusTreballats + ',' + stats.totalDies + ',' + stats.tancamentDies + ',' + stats.vacances + ',' + stats.baixes + ',' + stats.pendents + '\n';
      });
    }
    
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vacances_' + state.year + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Excel descarregat!');
  };

  const addWorker = () => {
    if (!newWorkerName.trim()) return;
    const id = 'w_' + Date.now();
    setState(s => ({
      ...s,
      workers: [...s.workers, { id, nom: newWorkerName.trim(), restaurant: s.currentRestaurant }],
      workerEvents: { ...s.workerEvents, [id]: {} }
    }));
    setNewWorkerName('');
    showToast('Treballador afegit!');
  };

  const deleteWorker = (id) => {
    if (!confirm('Segur que vols eliminar aquest treballador?')) return;
    setState(s => {
      const newEvents = { ...s.workerEvents };
      delete newEvents[id];
      return {
        ...s,
        workers: s.workers.filter(w => w.id !== id),
        workerEvents: newEvents,
        selectedWorker: s.selectedWorker === id ? null : s.selectedWorker
      };
    });
  };

  const getDayClass = (dateStr, dayOfWeek) => {
    if (state.selectedWorker) {
      const events = state.workerEvents[state.selectedWorker] || {};
      if (events[dateStr]) return events[dateStr];
    }
    for (const t of state.tancaments) {
      if (t.inici && t.fi && dateStr >= t.inici && dateStr <= t.fi) return 'tancament';
    }
    if (state.festius.find(f => f.data === dateStr && f.actiu)) return 'festiu';
    if (state.festius.find(f => f.data === dateStr && !f.actiu)) return 'tancat';
    if (dayOfWeek === 6 || dayOfWeek === 0) return 'tancat';
    return 'normal';
  };

  const handleDayClick = (dateStr) => {
    if (!state.selectedWorker) {
      showToast('Selecciona un treballador primer!');
      return;
    }
    for (const t of state.tancaments) {
      if (t.inici && t.fi && dateStr >= t.inici && dateStr <= t.fi) {
        showToast('Aquest dia es de tancament obligatori');
        return;
      }
    }
    setState(s => {
      const events = { ...s.workerEvents[s.selectedWorker] } || {};
      if (s.currentAction === 'esborrar') {
        delete events[dateStr];
      } else {
        events[dateStr] = s.currentAction;
      }
      return { ...s, workerEvents: { ...s.workerEvents, [s.selectedWorker]: events } };
    });
  };

  const getWorkersOnDate = (dateStr) => {
    const result = { vacances: [], baixa: [], festiu: [] };
    state.workers
      .filter(w => selectedRestaurants.includes(w.restaurant))
      .forEach(w => {
        const events = state.workerEvents[w.id] || {};
        if (events[dateStr]) {
          result[events[dateStr]]?.push(w.nom);
        }
      });
    return result;
  };

  const renderMonth = (month) => {
    const firstDay = new Date(state.year, month, 1);
    const lastDay = new Date(state.year, month + 1, 0);
    const startWeekday = (firstDay.getDay() + 6) % 7;
    
    const weeks = [];
    let currentWeek = [];
    
    for (let i = 0; i < startWeekday; i++) currentWeek.push(null);
    for (let day = 1; day <= lastDay.getDate(); day++) {
      currentWeek.push(day);
      if (currentWeek.length === 7) { weeks.push(currentWeek); currentWeek = []; }
    }
    if (currentWeek.length > 0) {
      while (currentWeek.length < 7) currentWeek.push(null);
      weeks.push(currentWeek);
    }
    
    const colors = {
      tancat: 'bg-zinc-700 text-zinc-400',
      festiu: 'bg-amber-500 text-black',
      tancament: 'bg-red-500 text-white',
      vacances: 'bg-emerald-500 text-white',
      baixa: 'bg-purple-500 text-white',
      normal: 'text-zinc-200 hover:bg-zinc-600'
    };
    
    const dayLabels = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
    
    return (
      <div key={month} className="bg-zinc-800 rounded-lg overflow-hidden">
        <div className="bg-orange-500 text-white text-center py-2 font-bold text-sm">
          {MONTHS[month]}
        </div>
        <div className="p-3">
          <div className="grid grid-cols-7 gap-1 mb-2">
            {dayLabels.map((d, i) => (
              <div key={i} className="text-center text-zinc-400 text-xs font-medium">{d}</div>
            ))}
          </div>
          {weeks.map((week, wi) => (
            <div key={wi} className="grid grid-cols-7 gap-1 mb-1">
              {week.map((day, di) => {
                if (day === null) return <div key={di} className="h-7" />;
                const dateStr = state.year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const type = getDayClass(dateStr, di);
                return (
                  <div
                    key={di}
                    onClick={() => handleDayClick(dateStr)}
                    className={'h-7 flex items-center justify-center text-sm rounded cursor-pointer ' + colors[type]}
                  >
                    {day}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    );
  };

  const renderMonthGeneral = (month) => {
    const firstDay = new Date(state.year, month, 1);
    const lastDay = new Date(state.year, month + 1, 0);
    const startWeekday = (firstDay.getDay() + 6) % 7;
    
    const weeks = [];
    let currentWeek = [];
    
    for (let i = 0; i < startWeekday; i++) currentWeek.push(null);
    for (let day = 1; day <= lastDay.getDate(); day++) {
      currentWeek.push(day);
      if (currentWeek.length === 7) { weeks.push(currentWeek); currentWeek = []; }
    }
    if (currentWeek.length > 0) {
      while (currentWeek.length < 7) currentWeek.push(null);
      weeks.push(currentWeek);
    }
    
    const dayLabels = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
    
    return (
      <div key={month} className="bg-zinc-800 rounded-lg overflow-hidden">
        <div className="bg-orange-500 text-white text-center py-2 font-bold text-sm">
          {MONTHS[month]}
        </div>
        <div className="p-2">
          <div className="grid grid-cols-7 gap-1 mb-2">
            {dayLabels.map((d, i) => (
              <div key={i} className="text-center text-zinc-400 text-xs font-medium">{d}</div>
            ))}
          </div>
          {weeks.map((week, wi) => (
            <div key={wi} className="grid grid-cols-7 gap-1 mb-1">
              {week.map((day, di) => {
                if (day === null) return <div key={di} className="h-12" />;
                const dateStr = state.year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const dayType = getDayClass(dateStr, di);
                const workers = getWorkersOnDate(dateStr);
                
                let bgColor = '';
                if (dayType === 'tancat') bgColor = 'bg-zinc-700';
                else if (dayType === 'tancament') bgColor = 'bg-red-500/30';
                else if (dayType === 'festiu') bgColor = 'bg-amber-500/30';
                
                return (
                  <div key={di} className={'h-12 rounded text-xs p-0.5 ' + bgColor + (dayType === 'tancat' ? ' text-zinc-500' : '')}>
                    <div className="font-medium mb-0.5">{day}</div>
                    {workers.vacances.length > 0 && (
                      <div className="text-emerald-400 truncate text-[9px]" title={workers.vacances.join(', ')}>
                        V:{workers.vacances.length}
                      </div>
                    )}
                    {workers.baixa.length > 0 && (
                      <div className="text-purple-400 truncate text-[9px]" title={workers.baixa.join(', ')}>
                        B:{workers.baixa.length}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    );
  };

  const selectedWorkerData = state.workers.find(w => w.id === state.selectedWorker);
  const stats = state.selectedWorker ? getWorkerStats(state.selectedWorker) : null;
  const filteredWorkers = state.workers.filter(w => w.restaurant === state.currentRestaurant);

  return (
    <div className="min-h-screen bg-black text-white flex">
      <div className="w-64 bg-zinc-900 border-r border-zinc-800 p-4 flex flex-col gap-4">
        <select 
          value={state.currentRestaurant}
          onChange={e => setState(s => ({ ...s, currentRestaurant: e.target.value, selectedWorker: null }))}
          className="bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm font-medium cursor-pointer"
        >
          {RESTAURANTS.map(r => (
            <option key={r.id} value={r.id}>{r.nom}</option>
          ))}
        </select>
        
        <div className="flex gap-1 bg-zinc-800 p-1 rounded-lg">
          <button onClick={() => setView('calendar')} className={'flex-1 py-2 px-3 rounded text-xs font-medium transition ' + (view === 'calendar' ? 'bg-orange-500 text-white' : 'text-zinc-400')}>Calendari</button>
          <button onClick={() => setView('config')} className={'flex-1 py-2 px-3 rounded text-xs font-medium transition ' + (view === 'config' ? 'bg-orange-500 text-white' : 'text-zinc-400')}>Config</button>
        </div>
        
        <div className="flex-1 flex flex-col gap-2 overflow-hidden">
          <div className="text-xs text-zinc-500 uppercase tracking-wider">Treballadors ({filteredWorkers.length})</div>
          <div className="flex-1 overflow-y-auto space-y-1">
            {filteredWorkers.map(w => {
              const wStats = getWorkerStats(w.id);
              return (
                <div
                  key={w.id}
                  onClick={() => setState(s => ({ ...s, selectedWorker: w.id }))}
                  className={'p-2 rounded-lg cursor-pointer flex justify-between items-center text-sm transition ' + (state.selectedWorker === w.id ? 'bg-orange-500' : 'hover:bg-zinc-800')}
                >
                  <span>{w.nom}</span>
                  <span className="text-xs bg-white/10 px-2 py-0.5 rounded font-mono">{wStats.pendents}d</span>
                </div>
              );
            })}
          </div>
          <div className="flex gap-2">
            <input
              type="text"
              value={newWorkerName}
              onChange={e => setNewWorkerName(e.target.value)}
              onKeyPress={e => e.key === 'Enter' && addWorker()}
              placeholder="Nom treballador..."
              className="flex-1 bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-sm"
            />
            <button onClick={addWorker} className="bg-orange-500 px-3 py-2 rounded font-semibold">+</button>
          </div>
        </div>
      </div>
      
      <div className="flex-1 p-6 overflow-y-auto">
        {view === 'calendar' ? (
          <>
            <div className="flex justify-between items-center mb-4">
              <h1 className="text-2xl font-bold">Calendari Laboral</h1>
              <div className="flex items-center gap-3">
                <div className="flex bg-zinc-800 rounded-lg p-1 mr-4">
                  <button 
                    onClick={() => setCalendarView('individual')}
                    className={'px-3 py-1 rounded text-sm ' + (calendarView === 'individual' ? 'bg-orange-500 text-white' : 'text-zinc-400')}
                  >
                    Individual
                  </button>
                  <button 
                    onClick={() => setCalendarView('general')}
                    className={'px-3 py-1 rounded text-sm ' + (calendarView === 'general' ? 'bg-orange-500 text-white' : 'text-zinc-400')}
                  >
                    General
                  </button>
                </div>
                <button onClick={() => setState(s => ({ ...s, year: s.year - 1 }))} className="w-8 h-8 rounded bg-zinc-800 border border-zinc-700">&lt;</button>
                <span className="font-mono text-lg font-bold">{state.year}</span>
                <button onClick={() => setState(s => ({ ...s, year: s.year + 1 }))} className="w-8 h-8 rounded bg-zinc-800 border border-zinc-700">&gt;</button>
              </div>
            </div>
            
            <div className="flex justify-between items-center mb-4">
              <div className="flex gap-4 flex-wrap text-xs text-zinc-400">
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-zinc-700 border border-zinc-600" /> Tancat</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-amber-500" /> Festiu treb.</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-red-500" /> Tancament</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-emerald-500" /> Vacances</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-purple-500" /> Baixa</div>
              </div>
              <button 
                onClick={exportToExcel}
                className="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-medium"
              >
                Exportar Excel
              </button>
            </div>
            
            {calendarView === 'general' && (
              <div className="flex gap-2 mb-4 flex-wrap">
                {RESTAURANTS.map(r => (
                  <label key={r.id} className={'flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer transition ' + (selectedRestaurants.includes(r.id) ? 'bg-zinc-700' : 'bg-zinc-800/50')}>
                    <input
                      type="checkbox"
                      checked={selectedRestaurants.includes(r.id)}
                      onChange={(e) => {
                        if (e.target.checked) {
                          setSelectedRestaurants([...selectedRestaurants, r.id]);
                        } else {
                          setSelectedRestaurants(selectedRestaurants.filter(id => id !== r.id));
                        }
                      }}
                      className="rounded"
                    />
                    <span className="text-sm">{r.nom}</span>
                  </label>
                ))}
              </div>
            )}
            
            <div className="grid grid-cols-3 gap-4">
              {Array.from({ length: 12 }, (_, i) => 
                calendarView === 'individual' ? renderMonth(i) : renderMonthGeneral(i)
              )}
            </div>
          </>
        ) : (
          <>
            <h1 className="text-2xl font-bold mb-6">Configuracio</h1>
            
            <div className="bg-zinc-900 rounded-lg p-4 border border-zinc-800 mb-4">
              <h3 className="font-semibold mb-1">Dies de vacances per conveni</h3>
              <p className="text-sm text-zinc-500 mb-3">Dies LABORABLES (Dt-Ds). Els 30 dies naturals = 22 laborables</p>
              <div className="flex items-center gap-3">
                <input
                  type="number"
                  value={state.diesConveni}
                  onChange={e => setState(s => ({ ...s, diesConveni: parseInt(e.target.value) || 22 }))}
                  className="w-20 bg-zinc-800 border border-zinc-700 rounded px-3 py-2"
                />
                <span className="text-zinc-500 text-sm">dies laborables / any</span>
              </div>
            </div>
            
            <div className="bg-zinc-900 rounded-lg p-4 border border-zinc-800 mb-4">
              <h3 className="font-semibold mb-1">Periodes de tancament obligatori</h3>
              <p className="text-sm text-zinc-500 mb-3">Es descompten automaticament de les vacances de tothom</p>
              {state.tancaments.map((t, i) => (
                <div key={i} className="flex gap-2 mb-2 items-center">
                  <input
                    type="text"
                    value={t.nom}
                    onChange={e => {
                      const newT = [...state.tancaments];
                      newT[i].nom = e.target.value;
                      setState(s => ({ ...s, tancaments: newT }));
                    }}
                    placeholder="Nom"
                    className="flex-1 bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-sm"
                  />
                  <input
                    type="date"
                    value={t.inici}
                    onChange={e => {
                      const newT = [...state.tancaments];
                      newT[i].inici = e.target.value;
                      setState(s => ({ ...s, tancaments: newT }));
                    }}
                    className="bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-sm"
                  />
                  <input
                    type="date"
                    value={t.fi}
                    onChange={e => {
                      const newT = [...state.tancaments];
                      newT[i].fi = e.target.value;
                      setState(s => ({ ...s, tancaments: newT }));
                    }}
                    className="bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-sm"
                  />
                  <button
                    onClick={() => setState(s => ({ ...s, tancaments: s.tancaments.filter((_, idx) => idx !== i) }))}
                    className="bg-red-500 px-3 py-2 rounded"
                  >X</button>
                </div>
              ))}
              <button
                onClick={() => setState(s => ({ ...s, tancaments: [...s.tancaments, { nom: '', inici: '', fi: '' }] }))}
                className="mt-2 bg-zinc-800 border border-zinc-700 px-4 py-2 rounded text-sm"
              >+ Afegir periode</button>
            </div>
            
            <div className="bg-zinc-900 rounded-lg p-4 border border-zinc-800">
              <h3 className="font-semibold mb-1">Festius {state.year}</h3>
              <p className="text-sm text-zinc-500 mb-3">Activa els festius que treballeu</p>
              <div className="space-y-2">
                {state.festius.map((f, i) => (
                  <div key={i} className="flex justify-between items-center bg-zinc-800 rounded px-3 py-2">
                    <div>
                      <div className="text-sm">{f.nom}</div>
                      <div className="text-xs text-zinc-500 font-mono">{f.data}</div>
                    </div>
                    <label className="relative inline-flex cursor-pointer">
                      <input
                        type="checkbox"
                        checked={f.actiu}
                        onChange={() => {
                          const newF = [...state.festius];
                          newF[i].actiu = !newF[i].actiu;
                          setState(s => ({ ...s, festius: newF }));
                        }}
                        className="sr-only peer"
                      />
                      <div className="w-11 h-6 bg-zinc-700 rounded-full peer peer-checked:bg-green-500 after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
                    </label>
                  </div>
                ))}
              </div>
            </div>
          </>
        )}
      </div>
      
      <div className="w-64 bg-zinc-900 border-l border-zinc-800 p-4 overflow-y-auto flex-shrink-0">
        {!state.selectedWorker ? (
          <div className="flex flex-col gap-4">
            <div className="text-center text-zinc-500 py-4">
              <p className="text-sm">Calendari base</p>
            </div>
            
            <div className="bg-zinc-800 rounded-lg p-3">
              <h3 className="text-xs uppercase text-zinc-500 tracking-wider mb-2">Resum general</h3>
              <div className="space-y-2 text-sm">
                <div className="flex justify-between">
                  <span className="text-zinc-400">Treballadors:</span>
                  <span className="font-mono">{state.workers.length}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-zinc-400">Dies conveni:</span>
                  <span className="font-mono">{state.diesConveni}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-zinc-400">Festius treballats:</span>
                  <span className="font-mono text-amber-400">{state.festius.filter(f => f.actiu && isDiaLaborable(f.data)).length}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-zinc-400">Dies tancament:</span>
                  <span className="font-mono text-red-400">{countTancamentDays()}</span>
                </div>
              </div>
            </div>
            
            <div className="bg-zinc-800 rounded-lg p-3">
              <h3 className="text-xs uppercase text-zinc-500 tracking-wider mb-2">Instruccions</h3>
              <p className="text-xs text-zinc-400 leading-relaxed">
                Selecciona un treballador de la llista per veure el seu resum i marcar vacances al calendari.
              </p>
            </div>
          </div>
        ) : (
          <>
            <div className="flex justify-between items-center border-b border-zinc-800 pb-3 mb-4">
              <span className="font-semibold text-lg">{selectedWorkerData?.nom}</span>
              <button onClick={() => deleteWorker(state.selectedWorker)} className="bg-red-500 px-2 py-1 rounded text-xs">Eliminar</button>
            </div>
            
            <div className="bg-zinc-800 rounded-lg p-4 mb-4">
              <h3 className="text-xs uppercase text-zinc-500 tracking-wider mb-3">Resum (dies laborables)</h3>
              <div className="grid grid-cols-2 gap-2">
                <div className="bg-zinc-900 rounded p-2 text-center">
                  <div className="font-mono text-xl font-bold">{stats.diesConveni}</div>
                  <div className="text-xs text-zinc-500">Conveni</div>
                </div>
                <div className="bg-zinc-900 rounded p-2 text-center">
                  <div className="font-mono text-xl font-bold text-amber-400">+{stats.festiusTreballats}</div>
                  <div className="text-xs text-zinc-500">Festius treb.</div>
                </div>
                <div className="bg-zinc-900 rounded p-2 text-center">
                  <div className="font-mono text-xl font-bold text-blue-400">{stats.totalDies}</div>
                  <div className="text-xs text-zinc-500">Total a gaudir</div>
                </div>
                <div className="bg-zinc-900 rounded p-2 text-center">
                  <div className="font-mono text-xl font-bold text-red-400">{stats.tancamentDies}</div>
                  <div className="text-xs text-zinc-500">Tancaments</div>
                </div>
                <div className="bg-zinc-900 rounded p-2 text-center">
                  <div className="font-mono text-xl font-bold text-green-400">{stats.vacances}</div>
                  <div className="text-xs text-zinc-500">Vacances</div>
                </div>
                <div className="bg-zinc-900 rounded p-2 text-center">
                  <div className="font-mono text-xl font-bold text-purple-400">{stats.baixes}</div>
                  <div className="text-xs text-zinc-500">Baixes</div>
                </div>
              </div>
              <div className="mt-4 pt-4 border-t border-zinc-700 text-center">
                <div className={'font-mono text-3xl font-bold ' + (stats.pendents >= 0 ? 'text-green-400' : 'text-red-400')}>{stats.pendents}</div>
                <div className="text-xs text-zinc-500">DIES PENDENTS</div>
              </div>
            </div>
            
            <div className="bg-zinc-800 rounded-lg p-4">
              <h3 className="text-xs uppercase text-zinc-500 tracking-wider mb-3">Accio al calendari</h3>
              <div className="grid grid-cols-2 gap-2">
                {[
                  { id: 'vacances', label: 'Vacances', color: 'border-green-400 bg-green-400/10 text-green-400' },
                  { id: 'baixa', label: 'Baixa', color: 'border-purple-400 bg-purple-400/10 text-purple-400' },
                  { id: 'festiu', label: 'Festiu rec.', color: 'border-amber-400 bg-amber-400/10 text-amber-400' },
                  { id: 'esborrar', label: 'Esborrar', color: 'border-red-400 bg-red-400/10 text-red-400' }
                ].map(action => (
                  <button
                    key={action.id}
                    onClick={() => setState(s => ({ ...s, currentAction: action.id }))}
                    className={'p-2 rounded border-2 text-xs font-medium transition ' + (state.currentAction === action.id ? action.color : 'border-zinc-700 text-zinc-400')}
                  >
                    {action.label}
                  </button>
                ))}
              </div>
              <p className="text-xs text-zinc-500 mt-3">Clica els dies del calendari per marcar-los</p>
            </div>
          </>
        )}
      </div>
      
      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-500 text-black px-6 py-3 rounded-lg font-semibold">
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
